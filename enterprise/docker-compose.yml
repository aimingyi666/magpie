# Enterprise gateway: one magpie instance holding the real provider keys.
# Clients reach it over the internal network with per-user gateway keys.
#
#   cp .env.example .env
#   docker compose up -d
#   docker compose exec gateway magpie gateway-key add alice --key <value>
#
# To run your fork's code instead of the upstream image, set MAGPIE_IMAGE to
# your registry image, or uncomment the build block below.
services:
  gateway:
    image: ${MAGPIE_IMAGE:-ghcr.io/yetone/magpie:stable}
    # build:
    #   context: ..
    #   dockerfile: Dockerfile
    container_name: magpie-gateway
    restart: unless-stopped
    ports:
      - "${MAGPIE_BIND:-0.0.0.0}:${MAGPIE_PORT:-3425}:3425"
    environment:
      MAGPIE_ADDR: 0.0.0.0:3425
      MAGPIE_ALLOW_IPS: ${MAGPIE_ALLOW_IPS:-127.0.0.1/32}
      MAGPIE_UPDATE_FEED: ${MAGPIE_UPDATE_FEED:-}
    volumes:
      - magpie-data:/config
    healthcheck:
      test: ["CMD-SHELL", "MAGPIE_ADDR=127.0.0.1:3425 /magpie healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional least-privilege adapter for gateway-key policy read/write. It is
  # intentionally not published on a host port and does not receive OIDC,
  # admin-session or issuer secrets.
  gateway-control:
    profiles: ["gateway-control", "auth", "admin"]
    build:
      context: ..
      dockerfile: enterprise/gateway-control/Dockerfile
    container_name: magpie-enterprise-gateway-control
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    expose:
      - "3446"
    environment:
      GATEWAY_CONTROL_TOKEN: ${GATEWAY_CONTROL_TOKEN:-}
      GATEWAY_CONTROL_MAGPIE: /usr/local/bin/magpie
      GATEWAY_CONTROL_CONFIG_HOME: /config
      GATEWAY_CONTROL_BIND: 0.0.0.0
      GATEWAY_CONTROL_PORT: 3446
      GATEWAY_CONTROL_TIMEOUT_MS: ${GATEWAY_CONTROL_TIMEOUT_MS:-10000}
    volumes:
      - magpie-data:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3446/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # M3-A resource catalog plus the M3-C client sync control plane. This
  # service is internal-only. The admin console now has read-only catalog and
  # sync-report visibility; publish/rollback UI and approval integration are
  # still unimplemented.
  # Start it explicitly with:
  #   docker compose --profile resource up -d resource
  resource:
    profiles: ["resource"]
    build:
      context: ./resource-service
      args:
        RESOURCE_UID: ${RESOURCE_UID:-10001}
        RESOURCE_GID: ${RESOURCE_GID:-10001}
    container_name: magpie-enterprise-resource
    restart: unless-stopped
    user: "${RESOURCE_UID:-10001}:${RESOURCE_GID:-10001}"
    expose:
      - "3447"
    environment:
      RESOURCE_BIND: 0.0.0.0
      RESOURCE_PORT: 3447
      RESOURCE_SERVICE_TOKEN: ${RESOURCE_SERVICE_TOKEN:-}
      RESOURCE_STORE_PATH: ${RESOURCE_STORE_PATH:-/data/resource-store.json}
      RESOURCE_CONTENT_PATH: ${RESOURCE_CONTENT_PATH:-/content/objects}
      RESOURCE_SIGNING_PRIVATE_KEY_PATH: /run/secrets/resource-signing-key.pem
      RESOURCE_SIGNING_KEY_ID: ${RESOURCE_SIGNING_KEY_ID:-}
      RESOURCE_MAX_CONTENT_BYTES: ${RESOURCE_MAX_CONTENT_BYTES:-1048576}
      RESOURCE_MAX_RESOURCES: ${RESOURCE_MAX_RESOURCES:-1000}
      RESOURCE_MAX_RELEASES_PER_RESOURCE: ${RESOURCE_MAX_RELEASES_PER_RESOURCE:-200}
      RESOURCE_SYNC_TOKEN_SECRET: ${RESOURCE_SYNC_TOKEN_SECRET:-}
      RESOURCE_SYNC_TOKEN_AUDIENCE: ${RESOURCE_SYNC_TOKEN_AUDIENCE:-magpie-enterprise-resource}
      RESOURCE_SYNC_REPORT_PATH: ${RESOURCE_SYNC_REPORT_PATH:-/data/sync-reports.json}
      RESOURCE_MAX_SNAPSHOT_BYTES: ${RESOURCE_MAX_SNAPSHOT_BYTES:-8388608}
      RESOURCE_MAX_SNAPSHOT_RESOURCES: ${RESOURCE_MAX_SNAPSHOT_RESOURCES:-200}
      RESOURCE_MAX_SYNC_REPORT_BYTES: ${RESOURCE_MAX_SYNC_REPORT_BYTES:-262144}
      RESOURCE_RATE_LIMIT_PER_MINUTE: ${RESOURCE_RATE_LIMIT_PER_MINUTE:-600}
    volumes:
      - resource-data:/data
      - resource-content:/content
    secrets:
      - source: resource-signing-key
        target: resource-signing-key.pem
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3447/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # M3-B remote MCP governance core. This service is internal-only and is not
  # yet wired into the admin console, auth-service or client synchronization.
  # Start it explicitly with:
  #   docker compose --profile mcp-gateway up -d mcp-gateway
  mcp-gateway:
    profiles: ["mcp-gateway"]
    build:
      context: ./mcp-gateway
      args:
        MCP_UID: ${MCP_UID:-10002}
        MCP_GID: ${MCP_GID:-10002}
    container_name: magpie-enterprise-mcp-gateway
    restart: unless-stopped
    user: "${MCP_UID:-10002}:${MCP_GID:-10002}"
    expose:
      - "3448"
    environment:
      MCP_BIND: 0.0.0.0
      MCP_PORT: 3448
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      MCP_SERVICE_TOKEN: ${MCP_SERVICE_TOKEN:-}
      MCP_APPROVAL_HMAC_SECRET: ${MCP_APPROVAL_HMAC_SECRET:-}
      MCP_STORE_PATH: ${MCP_STORE_PATH:-/data/mcp-registry.json}
      MCP_AUDIT_PATH: ${MCP_AUDIT_PATH:-/data/mcp-audit.jsonl}
      MCP_UPSTREAM_ALLOWED_HOSTS: ${MCP_UPSTREAM_ALLOWED_HOSTS:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      MCP_ALLOW_HTTP_UPSTREAMS: ${MCP_ALLOW_HTTP_UPSTREAMS:-false}
      MCP_ALLOW_PRIVATE_UPSTREAMS: ${MCP_ALLOW_PRIVATE_UPSTREAMS:-false}
      MCP_UPSTREAM_CA_PATH: ${MCP_UPSTREAM_CA_PATH:-}
      MCP_MAX_BODY_BYTES: ${MCP_MAX_BODY_BYTES:-262144}
      MCP_MAX_SERVERS: ${MCP_MAX_SERVERS:-500}
      MCP_MAX_CLIENTS: ${MCP_MAX_CLIENTS:-10000}
      MCP_MAX_TOOLS_PER_SERVER: ${MCP_MAX_TOOLS_PER_SERVER:-500}
      MCP_CATALOG_TTL_MS: ${MCP_CATALOG_TTL_MS:-60000}
      MCP_UPSTREAM_TIMEOUT_MS: ${MCP_UPSTREAM_TIMEOUT_MS:-10000}
      MCP_UPSTREAM_MAX_RESPONSE_BYTES: ${MCP_UPSTREAM_MAX_RESPONSE_BYTES:-1048576}
      MCP_HEALTH_INTERVAL_MS: ${MCP_HEALTH_INTERVAL_MS:-30000}
      MCP_HEALTH_TIMEOUT_MS: ${MCP_HEALTH_TIMEOUT_MS:-5000}
      MCP_BREAKER_FAILURE_THRESHOLD: ${MCP_BREAKER_FAILURE_THRESHOLD:-3}
      MCP_BREAKER_COOLDOWN_MS: ${MCP_BREAKER_COOLDOWN_MS:-30000}
      MCP_RATE_LIMIT_PER_MINUTE: ${MCP_RATE_LIMIT_PER_MINUTE:-600}
      MCP_AUTH_RATE_LIMIT_PER_MINUTE: ${MCP_AUTH_RATE_LIMIT_PER_MINUTE:-60}
      MCP_CLIENT_TOKEN_TTL_DAYS: ${MCP_CLIENT_TOKEN_TTL_DAYS:-30}
      MCP_APPROVAL_MAX_TTL_SECONDS: ${MCP_APPROVAL_MAX_TTL_SECONDS:-900}
    volumes:
      - mcp-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3448/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # M4-A/M4-B/M4-C/M4-D/M4-E audit core. This service is internal-only: it
  # accepts L0/L1 metadata events, stores optional L2 redacted content, and
  # exposes filtered content metadata, one-time body grants, retention/legal
  # holds, deletion proofs and encrypted export packages to admin-service.
  # M4-E administrator orchestration and the management UI are connected in
  # admin-service. Real gateway ingestion, enterprise IdP/MFA, TLS/reverse
  # proxy, WORM/KMS, HA and production acceptance remain incomplete.
  # Start it explicitly with:
  #   docker compose --profile audit up -d audit
  audit:
    profiles: ["audit"]
    build:
      context: ./audit-service
      args:
        AUDIT_UID: ${AUDIT_UID:-10003}
        AUDIT_GID: ${AUDIT_GID:-10003}
    container_name: magpie-enterprise-audit
    restart: unless-stopped
    user: "${AUDIT_UID:-10003}:${AUDIT_GID:-10003}"
    expose:
      - "3449"
    environment:
      AUDIT_BIND: 0.0.0.0
      AUDIT_PORT: 3449
      AUDIT_SERVICE_TOKEN: ${AUDIT_SERVICE_TOKEN:-}
      AUDIT_STORE_PATH: ${AUDIT_STORE_PATH:-/data/audit-store.json}
      AUDIT_MAX_BODY_BYTES: ${AUDIT_MAX_BODY_BYTES:-32768}
      AUDIT_MAX_EVENTS: ${AUDIT_MAX_EVENTS:-1000000}
      AUDIT_MAX_QUEUE_EVENTS: ${AUDIT_MAX_QUEUE_EVENTS:-100000}
      AUDIT_MAX_SESSIONS: ${AUDIT_MAX_SESSIONS:-100000}
      AUDIT_FLUSH_INTERVAL_MS: ${AUDIT_FLUSH_INTERVAL_MS:-1000}
      AUDIT_BATCH_SIZE: ${AUDIT_BATCH_SIZE:-200}
      AUDIT_RATE_LIMIT_PER_MINUTE: ${AUDIT_RATE_LIMIT_PER_MINUTE:-6000}
      AUDIT_CONTENT_ENABLED: ${AUDIT_CONTENT_ENABLED:-false}
      AUDIT_CONTENT_ENCRYPTION_KEY: ${AUDIT_CONTENT_ENCRYPTION_KEY:-}
      AUDIT_CONTENT_ADMIN_ENABLED: ${AUDIT_CONTENT_ADMIN_ENABLED:-false}
      AUDIT_CONTENT_ADMIN_TOKEN: ${AUDIT_CONTENT_ADMIN_TOKEN:-}
      AUDIT_CONTENT_ORGANIZATION_ID: ${AUDIT_CONTENT_ORGANIZATION_ID:-}
      AUDIT_CONTENT_GRANT_SECRET: ${AUDIT_CONTENT_GRANT_SECRET:-}
      AUDIT_CONTENT_CURSOR_SECRET: ${AUDIT_CONTENT_CURSOR_SECRET:-}
      AUDIT_CONTENT_GRANT_TTL_SECONDS: ${AUDIT_CONTENT_GRANT_TTL_SECONDS:-120}
      AUDIT_CONTENT_STORE_DIR: ${AUDIT_CONTENT_STORE_DIR:-/data/audit-content}
      AUDIT_CONTENT_MAX_BODY_BYTES: ${AUDIT_CONTENT_MAX_BODY_BYTES:-393216}
      AUDIT_CONTENT_MAX_CHUNK_BYTES: ${AUDIT_CONTENT_MAX_CHUNK_BYTES:-262144}
      AUDIT_CONTENT_MAX_STREAM_BYTES: ${AUDIT_CONTENT_MAX_STREAM_BYTES:-1048576}
      AUDIT_CONTENT_MAX_BUFFER_BYTES: ${AUDIT_CONTENT_MAX_BUFFER_BYTES:-67108864}
      AUDIT_CONTENT_MAX_ACTIVE_STREAMS: ${AUDIT_CONTENT_MAX_ACTIVE_STREAMS:-256}
      AUDIT_CONTENT_STREAM_TTL_MS: ${AUDIT_CONTENT_STREAM_TTL_MS:-900000}
      AUDIT_CONTENT_GOVERNANCE_ENABLED: ${AUDIT_CONTENT_GOVERNANCE_ENABLED:-false}
      AUDIT_CONTENT_GOVERNANCE_TOKEN: ${AUDIT_CONTENT_GOVERNANCE_TOKEN:-}
      AUDIT_CONTENT_PROOF_SECRET: ${AUDIT_CONTENT_PROOF_SECRET:-}
      AUDIT_CONTENT_EXPORT_ENABLED: ${AUDIT_CONTENT_EXPORT_ENABLED:-false}
      AUDIT_CONTENT_EXPORT_SECRET: ${AUDIT_CONTENT_EXPORT_SECRET:-}
      AUDIT_CONTENT_EXPORT_KEY: ${AUDIT_CONTENT_EXPORT_KEY:-}
      AUDIT_CONTENT_EXPORT_TTL_SECONDS: ${AUDIT_CONTENT_EXPORT_TTL_SECONDS:-120}
      AUDIT_CONTENT_RETENTION_SWEEP_INTERVAL_MS: ${AUDIT_CONTENT_RETENTION_SWEEP_INTERVAL_MS:-3600000}
    volumes:
      - audit-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3449/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  auth:
    profiles: ["auth", "admin"]
    build:
      context: ./auth-service
    container_name: magpie-enterprise-auth
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
      gateway-control:
        condition: service_healthy
    ports:
      - "${AUTH_BIND:-0.0.0.0}:${AUTH_HOST_PORT:-3444}:3444"
    environment:
      AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-http://127.0.0.1:3444}
      AUTH_PORT: 3444
      AUTH_BIND: 0.0.0.0
      AUTH_STORE_PATH: /data/auth-store.json
      AUTH_COOKIE_SECRET: ${AUTH_COOKIE_SECRET:-}
      AUTH_ADMIN_TOKEN: ${AUTH_ADMIN_TOKEN:-}
      AUTH_INTERNAL_ADMIN_TOKEN: ${AUTH_INTERNAL_ADMIN_TOKEN:-}
      AUTH_SECURE_COOKIE: ${AUTH_SECURE_COOKIE:-true}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-12}
      AUTH_DEVICE_TOKEN_TTL_DAYS: ${AUTH_DEVICE_TOKEN_TTL_DAYS:-30}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-120}
      AUTH_ALLOWED_RETURN_ORIGINS: ${AUTH_ALLOWED_RETURN_ORIGINS:-}
      # M3-C device sync credential. The secret must be the same value as
      # RESOURCE_SYNC_TOKEN_SECRET and must differ from every other secret.
      SYNC_TOKEN_SECRET: ${SYNC_TOKEN_SECRET:-}
      SYNC_TOKEN_TTL_SECONDS: ${SYNC_TOKEN_TTL_SECONDS:-300}
      SYNC_TOKEN_AUDIENCE: ${SYNC_TOKEN_AUDIENCE:-magpie-enterprise-resource}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_TOKEN_AUTH_METHOD: ${OIDC_TOKEN_AUTH_METHOD:-client_secret_basic}
      OIDC_ALLOWED_EMAIL_DOMAINS: ${OIDC_ALLOWED_EMAIL_DOMAINS:-}
      OIDC_EMAIL_CLAIM: ${OIDC_EMAIL_CLAIM:-email}
      OIDC_NAME_CLAIM: ${OIDC_NAME_CLAIM:-name}
      MAGPIE_GATEWAY_URL: http://gateway:3425
      MAGPIE_GATEWAY_PUBLIC_URL: ${MAGPIE_GATEWAY_PUBLIC_URL:-https://ai.corp.example}
      MAGPIE_ISSUER_KEY: ${MAGPIE_ISSUER_KEY:-}
      MAGPIE_KEY_TTL: ${MAGPIE_KEY_TTL:-8h}
      MAGPIE_KEY_MODELS: ${MAGPIE_KEY_MODELS:-}
      MAGPIE_KEY_TOKENS: ${MAGPIE_KEY_TOKENS:-0}
      MAGPIE_KEY_COST: ${MAGPIE_KEY_COST:-0}
      GATEWAY_CONTROL_URL: ${GATEWAY_CONTROL_URL:-http://gateway-control:3446}
      GATEWAY_CONTROL_TOKEN: ${GATEWAY_CONTROL_TOKEN:-}
      GATEWAY_CONTROL_TIMEOUT_MS: ${GATEWAY_CONTROL_TIMEOUT_MS:-10000}
    volumes:
      - auth-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3444/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  admin:
    profiles: ["admin"]
    build:
      context: ./admin-service
    container_name: magpie-enterprise-admin
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
    ports:
      - "${ADMIN_BIND:-0.0.0.0}:${ADMIN_HOST_PORT:-3445}:3445"
    environment:
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:-http://127.0.0.1:3445}
      ADMIN_PORT: 3445
      ADMIN_BIND: 0.0.0.0
      ADMIN_STORE_PATH: /data/admin-store.json
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      ADMIN_SECURE_COOKIE: ${ADMIN_SECURE_COOKIE:-true}
      ADMIN_SESSION_TTL_HOURS: ${ADMIN_SESSION_TTL_HOURS:-8}
      ADMIN_IDLE_TIMEOUT_MINUTES: ${ADMIN_IDLE_TIMEOUT_MINUTES:-30}
      ADMIN_RATE_LIMIT_PER_MINUTE: ${ADMIN_RATE_LIMIT_PER_MINUTE:-120}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-127.0.0.1/32,::1/128}
      ADMIN_BOOTSTRAP_SUBJECTS: ${ADMIN_BOOTSTRAP_SUBJECTS:-}
      ADMIN_BOOTSTRAP_EMAILS: ${ADMIN_BOOTSTRAP_EMAILS:-}
      ADMIN_BOOTSTRAP_VALID_HOURS: ${ADMIN_BOOTSTRAP_VALID_HOURS:-24}
      ADMIN_OIDC_ISSUER: ${ADMIN_OIDC_ISSUER:-}
      ADMIN_OIDC_CLIENT_ID: ${ADMIN_OIDC_CLIENT_ID:-}
      ADMIN_OIDC_CLIENT_SECRET: ${ADMIN_OIDC_CLIENT_SECRET:-}
      ADMIN_OIDC_REDIRECT_URI: ${ADMIN_OIDC_REDIRECT_URI:-}
      ADMIN_OIDC_SCOPES: ${ADMIN_OIDC_SCOPES:-openid profile email}
      ADMIN_OIDC_TOKEN_AUTH_METHOD: ${ADMIN_OIDC_TOKEN_AUTH_METHOD:-client_secret_basic}
      ADMIN_ALLOWED_EMAIL_DOMAINS: ${ADMIN_ALLOWED_EMAIL_DOMAINS:-}
      ADMIN_EMAIL_CLAIM: ${ADMIN_EMAIL_CLAIM:-email}
      ADMIN_NAME_CLAIM: ${ADMIN_NAME_CLAIM:-name}
      ADMIN_REQUIRE_MFA: ${ADMIN_REQUIRE_MFA:-true}
      ADMIN_REQUIRE_VERIFIED_EMAIL: ${ADMIN_REQUIRE_VERIFIED_EMAIL:-true}
      ADMIN_ALLOWED_ACR_VALUES: ${ADMIN_ALLOWED_ACR_VALUES:-}
      ADMIN_STEP_UP_OIDC_CLIENT_ID: ${ADMIN_STEP_UP_OIDC_CLIENT_ID:-}
      ADMIN_STEP_UP_OIDC_CLIENT_SECRET: ${ADMIN_STEP_UP_OIDC_CLIENT_SECRET:-}
      ADMIN_STEP_UP_REDIRECT_URI: ${ADMIN_STEP_UP_REDIRECT_URI:-}
      ADMIN_STEP_UP_OIDC_SCOPES: ${ADMIN_STEP_UP_OIDC_SCOPES:-openid profile email}
      ADMIN_STEP_UP_ALLOWED_ACR_VALUES: ${ADMIN_STEP_UP_ALLOWED_ACR_VALUES:-}
      ADMIN_STEP_UP_TTL_SECONDS: ${ADMIN_STEP_UP_TTL_SECONDS:-600}
      ADMIN_STEP_UP_CRITICAL_TTL_SECONDS: ${ADMIN_STEP_UP_CRITICAL_TTL_SECONDS:-300}
      ADMIN_STEP_UP_AUTH_TIME_MAX_AGE_SECONDS: ${ADMIN_STEP_UP_AUTH_TIME_MAX_AGE_SECONDS:-120}
      ADMIN_AUTH_SERVICE_URL: http://auth:3444
      ADMIN_AUTH_SERVICE_TOKEN: ${AUTH_INTERNAL_ADMIN_TOKEN:-}
      ADMIN_AUTH_SERVICE_TIMEOUT_MS: ${ADMIN_AUTH_SERVICE_TIMEOUT_MS:-5000}
      ADMIN_RESOURCE_SERVICE_URL: ${ADMIN_RESOURCE_SERVICE_URL:-}
      ADMIN_RESOURCE_SERVICE_TOKEN: ${ADMIN_RESOURCE_SERVICE_TOKEN:-}
      ADMIN_RESOURCE_SERVICE_TIMEOUT_MS: ${ADMIN_RESOURCE_SERVICE_TIMEOUT_MS:-5000}
      ADMIN_RESOURCE_SERVICE_MAX_RESPONSE_BYTES: ${ADMIN_RESOURCE_SERVICE_MAX_RESPONSE_BYTES:-4194304}
      ADMIN_AUDIT_CONTENT_SERVICE_URL: ${ADMIN_AUDIT_CONTENT_SERVICE_URL:-}
      ADMIN_AUDIT_CONTENT_SERVICE_ADMIN_TOKEN: ${ADMIN_AUDIT_CONTENT_SERVICE_ADMIN_TOKEN:-}
      ADMIN_AUDIT_CONTENT_SERVICE_GOVERNANCE_TOKEN: ${ADMIN_AUDIT_CONTENT_SERVICE_GOVERNANCE_TOKEN:-}
      ADMIN_AUDIT_CONTENT_SERVICE_ORGANIZATION_ID: ${ADMIN_AUDIT_CONTENT_SERVICE_ORGANIZATION_ID:-}
      ADMIN_AUDIT_CONTENT_EXPORT_KEY: ${ADMIN_AUDIT_CONTENT_EXPORT_KEY:-}
      ADMIN_AUDIT_CONTENT_SERVICE_TIMEOUT_MS: ${ADMIN_AUDIT_CONTENT_SERVICE_TIMEOUT_MS:-5000}
      ADMIN_AUDIT_CONTENT_SERVICE_MAX_RESPONSE_BYTES: ${ADMIN_AUDIT_CONTENT_SERVICE_MAX_RESPONSE_BYTES:-4194304}
      ADMIN_AUDIT_CONTENT_SERVICE_MAX_EXPORT_BYTES: ${ADMIN_AUDIT_CONTENT_SERVICE_MAX_EXPORT_BYTES:-33554432}
      ADMIN_APPROVAL_CALLBACK_SECRET: ${ADMIN_APPROVAL_CALLBACK_SECRET:-}
      ADMIN_APPROVAL_CALLBACK_ISSUER: ${ADMIN_APPROVAL_CALLBACK_ISSUER:-}
      ADMIN_APPROVAL_CALLBACK_AUDIENCE: ${ADMIN_APPROVAL_CALLBACK_AUDIENCE:-}
      ADMIN_APPROVAL_CALLBACK_MAX_SKEW_SECONDS: ${ADMIN_APPROVAL_CALLBACK_MAX_SKEW_SECONDS:-300}
      ADMIN_APPROVAL_CALLBACK_NONCE_TTL_SECONDS: ${ADMIN_APPROVAL_CALLBACK_NONCE_TTL_SECONDS:-600}
      ADMIN_NOTIFICATION_OUTBOX_POLL_SECONDS: ${ADMIN_NOTIFICATION_OUTBOX_POLL_SECONDS:-30}
      ADMIN_NOTIFICATION_OUTBOX_LEASE_SECONDS: ${ADMIN_NOTIFICATION_OUTBOX_LEASE_SECONDS:-60}
      ADMIN_NOTIFICATION_OUTBOX_MAX_ATTEMPTS: ${ADMIN_NOTIFICATION_OUTBOX_MAX_ATTEMPTS:-6}
      ADMIN_NOTIFICATION_OUTBOX_BATCH_SIZE: ${ADMIN_NOTIFICATION_OUTBOX_BATCH_SIZE:-20}
      ADMIN_NOTIFICATION_CHANNELS_ENABLED: ${ADMIN_NOTIFICATION_CHANNELS_ENABLED:-false}
      ADMIN_NOTIFICATION_OUTBOUND_ALLOWLIST: ${ADMIN_NOTIFICATION_OUTBOUND_ALLOWLIST:-}
      ADMIN_NOTIFICATION_EMAIL_RECIPIENT_DOMAINS: ${ADMIN_NOTIFICATION_EMAIL_RECIPIENT_DOMAINS:-}
      ADMIN_NOTIFICATION_HTTP_TIMEOUT_MS: ${ADMIN_NOTIFICATION_HTTP_TIMEOUT_MS:-5000}
      ADMIN_NOTIFICATION_HTTP_MAX_RESPONSE_BYTES: ${ADMIN_NOTIFICATION_HTTP_MAX_RESPONSE_BYTES:-65536}
      ADMIN_NOTIFICATION_HTTP_MAX_REDIRECTS: ${ADMIN_NOTIFICATION_HTTP_MAX_REDIRECTS:-3}
      MAGPIE_NOTIFICATION_WEBHOOK_SECRET: ${MAGPIE_NOTIFICATION_WEBHOOK_SECRET:-}
      MAGPIE_NOTIFICATION_IM_TOKEN: ${MAGPIE_NOTIFICATION_IM_TOKEN:-}
      MAGPIE_NOTIFICATION_EMAIL_GATEWAY_TOKEN: ${MAGPIE_NOTIFICATION_EMAIL_GATEWAY_TOKEN:-}
      MAGPIE_NOTIFICATION_TICKETING_TOKEN: ${MAGPIE_NOTIFICATION_TICKETING_TOKEN:-}
      ADMIN_MODELS: ${ADMIN_MODELS:-}
      ADMIN_MODEL_CATALOG_PATH: /etc/magpie-enterprise/model-catalog.json
      ADMIN_MODEL_CATALOG_DIGEST: ${ADMIN_MODEL_CATALOG_DIGEST:-}
      ADMIN_USAGE_PATH: ${ADMIN_USAGE_PATH:-/magpie-readonly/magpie/usage.jsonl}
      ADMIN_USAGE_MAX_BYTES: ${ADMIN_USAGE_MAX_BYTES:-268435456}
      ADMIN_USAGE_MAX_LINE_BYTES: ${ADMIN_USAGE_MAX_LINE_BYTES:-1048576}
      ADMIN_USAGE_MAX_RECORDS: ${ADMIN_USAGE_MAX_RECORDS:-1000000}
      ADMIN_USAGE_MAX_FIELDS: ${ADMIN_USAGE_MAX_FIELDS:-256}
      ADMIN_USAGE_MAX_RANGE_DAYS: ${ADMIN_USAGE_MAX_RANGE_DAYS:-366}
    volumes:
      - admin-data:/data
      - magpie-data:/magpie-readonly:ro
      - ./model-catalog.json:/etc/magpie-enterprise/model-catalog.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3445/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  magpie-data:
  auth-data:
  admin-data:
  resource-data:
  resource-content:
  mcp-data:
  audit-data:

secrets:
  resource-signing-key:
    file: ${RESOURCE_SIGNING_KEY_FILE:-./secrets/resource-signing-key.pem}
